<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">TRACK method overview</title>
  <desc id="desc">Node-specific profiles create decoupling prompts for temporal and spatial aggregation in inductive spatio-temporal kriging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="22" fill="url(#bg)"/>
  <text x="480" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172554">TRACK</text>
  <text x="480" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Temporal Decoupled Kriging for Inductive Spatio-Temporal Graph</text>

  <g filter="url(#shadow)">
    <rect x="45" y="145" width="170" height="250" rx="16" fill="#fff" stroke="#dbeafe"/>
    <rect x="260" y="145" width="180" height="250" rx="16" fill="#fff" stroke="#dbeafe"/>
    <rect x="485" y="145" width="180" height="250" rx="16" fill="#fff" stroke="#ddd6fe"/>
    <rect x="710" y="145" width="205" height="250" rx="16" fill="#fff" stroke="#dbeafe"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="130" y="182" font-size="18" font-weight="700" fill="#1e3a8a">Observed Graph</text>
    <text x="350" y="182" font-size="18" font-weight="700" fill="#1e3a8a">Node Profile</text>
    <text x="575" y="182" font-size="18" font-weight="700" fill="#5b21b6">Decoupling Prompts</text>
    <text x="812" y="182" font-size="18" font-weight="700" fill="#1e3a8a">Kriging Prediction</text>
  </g>

  <g stroke="#93c5fd" stroke-width="5">
    <line x1="88" y1="246" x2="132" y2="220"/><line x1="132" y1="220" x2="176" y2="254"/>
    <line x1="88" y1="246" x2="112" y2="310"/><line x1="112" y1="310" x2="170" y2="326"/>
    <line x1="176" y1="254" x2="170" y2="326"/><line x1="132" y1="220" x2="112" y2="310"/>
  </g>
  <g fill="#2563eb" stroke="#fff" stroke-width="4">
    <circle cx="88" cy="246" r="15"/><circle cx="132" cy="220" r="15"/><circle cx="176" cy="254" r="15"/><circle cx="112" cy="310" r="15"/>
  </g>
  <circle cx="170" cy="326" r="17" fill="#fff" stroke="#f59e0b" stroke-width="5" stroke-dasharray="5 4"/>
  <text x="130" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">observed + unseen nodes</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="292" y="215" width="116" height="42" rx="9" fill="#e8f0fe"/><text x="350" y="242" font-size="15" fill="#1d4ed8">Geography</text>
    <rect x="292" y="273" width="116" height="42" rx="9" fill="#e6f4ea"/><text x="350" y="300" font-size="15" fill="#188038">Periodicity</text>
    <path d="M310 342 H390" stroke="url(#blue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M325 360 H375" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="515" y="215" width="120" height="52" rx="12" fill="#ede9fe"/><text x="575" y="247" font-size="16" fill="#6d28d9">Temporal</text>
    <rect x="515" y="292" width="120" height="52" rx="12" fill="#dbeafe"/><text x="575" y="324" font-size="16" fill="#1d4ed8">Spatial</text>
    <text x="575" y="372" font-size="14" fill="#64748b">separate coupled features</text>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M755 284 C785 224 840 224 870 284 C840 344 785 344 755 284Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <circle cx="812" cy="284" r="24" fill="#2563eb"/>
    <path d="M799 284 l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="812" y="366" font-size="14" fill="#64748b">inductive reconstruction</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <line x1="220" y1="270" x2="250" y2="270"/>
    <line x1="445" y1="270" x2="475" y2="270"/>
    <line x1="670" y1="270" x2="700" y2="270"/>
  </g>

  <rect x="285" y="438" width="390" height="54" rx="27" fill="url(#blue)"/>
  <text x="480" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Node inherency ↔ dynamic correlation</text>
</svg>
